name: Renovar Developer Mode
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar as TVs
        env:
          LG_TOKEN_MAE: ${{ secrets.LG_TOKEN_MAE }}
          LG_TOKEN_TV: ${{ secrets.LG_TOKEN_TV }}
        run: |
          falhou=0; renovadas=0
          for par in "mae:$LG_TOKEN_MAE" "tv:$LG_TOKEN_TV"; do
            nome=${par%%:*}; token=${par#*:}
            if [ -z "$token" ]; then echo "$nome: sem token"; continue; fi
            curl -sS --max-time 30 "https://developer.lge.com/secure/ResetDevModeSession.dev?sessionToken=$token" > /dev/null || true
            resp=$(curl -sS --max-time 30 "https://developer.lge.com/secure/CheckDevModeSession.dev?sessionToken=$token" || true)
            if echo "$resp" | grep -q '"result":"success"'; then
              echo "$nome: ok, restam $(echo "$resp" | sed -n 's/.*"errorMsg":"\([^"]*\)".*/\1/p')"; renovadas=$((renovadas+1))
            else
              codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://developer.lge.com/secure/CheckDevModeSession.dev?sessionToken=$token" || true)
              echo "::error::$nome: resposta inesperada da LG (HTTP $codigo): $(echo "$resp" | head -c 200 | tr -d '\n' | sed "s/$token/***/g")"; falhou=1
            fi
          done
          [ "$renovadas" -gt 0 ] || falhou=1
          exit $falhou
      # O GitHub desliga agendamentos depois de 60 dias sem atividade no repositório: reativar a cada execução evita isso
      - name: Manter o agendamento ligado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/renovar.yml/enable"
